spring:
  application:
    name: sca-order
  cloud:
    nacos:
      discovery:
        # 宿主机映射端口（与 nacos-standalone -p 38848:8848 一致）
        server-addr: 127.0.0.1:38848
        username: nacos
        password: nacOsdev316
  insight:
    # ---- Agent 本地联调：全部打开，与 compose.dev 默认 Token 对齐 ----
    enabled: true
    server-url: http://localhost:9966
    # service-name 默认取 spring.application.name=sca-order
    ingest-token: change-me
    sample-rate: 1.0
    http-tracing-enabled: true
    context-propagation-enabled: true
    micrometer-enabled: true
    diagnostic-logs: true
    jvm-metrics:
      enabled: true
    db-metrics:
      enabled: true

server:
  port: 18081

# RestClient 造数直连商品服务
demo:
  product-base-url: http://127.0.0.1:18082

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
