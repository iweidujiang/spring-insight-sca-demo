spring:
  application:
    name: sca-user
  datasource:
    url: jdbc:h2:mem:sca_user_demo;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      # 本机 Redis 若开启 requirepass，可在环境变量或此处填写
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2s
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:38848
        username: nacos
        password: nacOsdev316
  insight:
    enabled: true
    server-url: http://localhost:9966
    ingest-token: change-me
    sample-rate: 1.0
    http-tracing-enabled: true
    context-propagation-enabled: true
    # JDBC 追踪（包装 DataSource）；错误始终上报，成功仅慢 SQL
    jdbc-tracing-enabled: true
    jdbc-slow-threshold-ms: 500
    # Redis 追踪：造数要看见 GET/SET/HGET 等命令分布，成功也上报
    redis-tracing-enabled: true
    redis-slow-threshold-ms: 0
    micrometer-enabled: true
    diagnostic-logs: true
    jvm-metrics:
      enabled: true
    # 存活心跳（联调缩短间隔；默认也可不写，Agent 默认 60s）
    heartbeat:
      enabled: true
      interval-ms: 10000

server:
  port: 18083

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
