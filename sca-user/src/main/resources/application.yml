spring:
  application:
    name: sca-user
  datasource:
    url: jdbc:h2:mem:sca_user_demo;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:38848
        username: nacos
        password: nacOsdev316
  insight:
    enabled: true
    server-url: http://localhost:9966
    ingest-token: change-me
    sample-rate: 1.0
    http-tracing-enabled: true
    context-propagation-enabled: true
    # JDBC 追踪（包装 DataSource）；错误始终上报，成功仅慢 SQL
    jdbc-tracing-enabled: true
    jdbc-slow-threshold-ms: 500
    micrometer-enabled: true
    diagnostic-logs: true
    jvm-metrics:
      enabled: true

server:
  port: 18083

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
