spring:
  data:
    redis:
      # 容器内连 compose 的 sca-demo-redis（无密码）；勿写成宿主机映射口 6380
      host: ${SPRING_DATA_REDIS_HOST:sca-demo-redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2s
  cloud:
    nacos:
      discovery:
        server-addr: nacos-standalone:8848
        username: nacos
        password: nacOsdev316
  insight:
    enabled: true
    server-url: http://host.docker.internal:9966
    ingest-token: change-me
    sample-rate: 1.0
    http-tracing-enabled: true
    context-propagation-enabled: true
    jdbc-tracing-enabled: true
    jdbc-slow-threshold-ms: 500
    redis-tracing-enabled: true
    redis-slow-threshold-ms: 0
    micrometer-enabled: true
    diagnostic-logs: true
    jvm-metrics:
      enabled: true

server:
  address: 0.0.0.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
