name: spring-insight-sca-demo

# 本工程是独立第三方 Demo
# 使用前先准备：
#   1) 本机已有 Nacos（例如容器 nacos-standalone，网络 my-network）
#   2) 将 Spring Insight install 到 Maven 仓库，并在 .env 配置 MAVEN_REPO、INSIGHT_SERVER_JAR
#   3) .env 中 DOCKER_NETWORK 与 Nacos 所在网络一致（默认 my-network）

x-sca-env: &sca-env
  SPRING_PROFILES_ACTIVE: docker
  # 覆盖 application-docker.yml，指向外部 Nacos
  SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: ${NACOS_SERVER_ADDR:-nacos-standalone:8848}
  SPRING_CLOUD_NACOS_DISCOVERY_USERNAME: ${NACOS_USERNAME:-nacos}
  SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: ${NACOS_PASSWORD:-nacos}

x-service-build: &service-build
  context: .
  dockerfile: Dockerfile.service
  additional_contexts:
    m2repo: ${MAVEN_REPO:?请在 .env 中设置 MAVEN_REPO 为本机 Maven localRepository 路径}
  args:
    MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9.9-eclipse-temurin-21}

services:
  # 独立监测中心：挂载已构建的 insight-server jar
  insight-server:
    image: ${JAVA_RUNTIME_IMAGE:-eclipse-temurin:21-jre-alpine}
    container_name: insight-server
    volumes:
      - ${INSIGHT_SERVER_JAR:?请在 .env 中设置 INSIGHT_SERVER_JAR 为 insight-server 可执行 jar 路径}:/app/app.jar:ro
    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "9966:9966"
    networks: [demo-net]

  sca-product:
    build:
      <<: *service-build
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9.9-eclipse-temurin-21}
        MODULE: sca-product
        SERVER_PORT: "18082"
    environment:
      <<: *sca-env
    depends_on:
      insight-server:
        condition: service_started
    networks: [demo-net]

  sca-loyalty:
    build:
      <<: *service-build
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9.9-eclipse-temurin-21}
        MODULE: sca-loyalty
        SERVER_PORT: "18084"
    environment:
      <<: *sca-env
    depends_on:
      insight-server:
        condition: service_started
    networks: [demo-net]

  sca-user:
    build:
      <<: *service-build
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9.9-eclipse-temurin-21}
        MODULE: sca-user
        SERVER_PORT: "18083"
    environment:
      <<: *sca-env
    depends_on:
      insight-server:
        condition: service_started
      sca-loyalty:
        condition: service_started
    networks: [demo-net]

  sca-order:
    build:
      <<: *service-build
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9.9-eclipse-temurin-21}
        MODULE: sca-order
        SERVER_PORT: "18081"
    ports:
      - "8081:18081"
    environment:
      <<: *sca-env
    depends_on:
      insight-server:
        condition: service_started
      sca-user:
        condition: service_started
      sca-product:
        condition: service_started
    networks: [demo-net]

  sca-gateway:
    build:
      <<: *service-build
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9.9-eclipse-temurin-21}
        MODULE: sca-gateway
        SERVER_PORT: "18080"
    ports:
      - "8080:18080"
    environment:
      <<: *sca-env
    depends_on:
      insight-server:
        condition: service_started
      sca-order:
        condition: service_started
    networks: [demo-net]

  traffic:
    profiles: ["traffic"]
    image: curlimages/curl:8.5.0
    depends_on:
      sca-gateway:
        condition: service_started
    command:
      - sh
      - -c
      - |
          sleep 40
          while true; do
            curl -sS "http://sca-gateway:18080/order/create?userId=1&productId=1" || true
            echo ""
            sleep 10
          done
    networks: [demo-net]

networks:
  # 接入本机已存在的 Docker 网络
  demo-net:
    name: ${DOCKER_NETWORK:-my-network}
    external: true
