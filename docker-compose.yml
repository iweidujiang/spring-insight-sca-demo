name: spring-insight-sca-demo

# 本工程是独立第三方 Demo：只起业务微服务，不拉起 insight-server。
# 使用前请先准备：
#   1) 本机已有 Nacos（例如容器 nacos-standalone，网络 my-network）
#   2) 已单独启动 Spring Insight Server（推荐 GHCR 镜像，宿主机 9966）
#   3) 业务侧能解析 spring-insight-agent-starter（Central 或本地 install）
#   4) .env 中配置 MAVEN_REPO、DOCKER_NETWORK（与 Nacos 同网）
# 宿主机端口被占用时：用 scripts/docker-up.ps1（或 docker-up.sh）自动换端口后再启动
#
# 默认上报地址：http://host.docker.internal:9966（容器访问宿主机上的 Server）
# 若把 Server 容器加入同一 Docker 网络并命名为 insight-server，可在 .env 设：
#   INSIGHT_SERVER_URL=http://insight-server:9966

x-sca-env: &sca-env
  SPRING_PROFILES_ACTIVE: docker
  SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: ${NACOS_SERVER_ADDR:-nacos-standalone:8848}
  SPRING_CLOUD_NACOS_DISCOVERY_USERNAME: ${NACOS_USERNAME:-nacos}
  SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: ${NACOS_PASSWORD:-nacOsdev316}
  # 覆盖 application-docker.yml；指向外部已启动的 insight-server
  SPRING_INSIGHT_SERVER_URL: ${INSIGHT_SERVER_URL:-http://host.docker.internal:9966}

x-service-build: &service-build
  context: .
  dockerfile: Dockerfile.service
  additional_contexts:
    m2repo: ${MAVEN_REPO:?请在 .env 中设置 MAVEN_REPO 为本机 Maven localRepository 路径}
  args:
    MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9.9-eclipse-temurin-21}

services:
  sca-product:
    build:
      <<: *service-build
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9.9-eclipse-temurin-21}
        MODULE: sca-product
        SERVER_PORT: "18082"
    environment:
      <<: *sca-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [demo-net]

  sca-loyalty:
    build:
      <<: *service-build
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9.9-eclipse-temurin-21}
        MODULE: sca-loyalty
        SERVER_PORT: "18084"
    environment:
      <<: *sca-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [demo-net]

  sca-user:
    build:
      <<: *service-build
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9.9-eclipse-temurin-21}
        MODULE: sca-user
        SERVER_PORT: "18083"
    environment:
      <<: *sca-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      sca-loyalty:
        condition: service_started
    networks: [demo-net]

  sca-order:
    build:
      <<: *service-build
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9.9-eclipse-temurin-21}
        MODULE: sca-order
        SERVER_PORT: "18081"
    ports:
      - "${ORDER_HOST_PORT:-8081}:18081"
    environment:
      <<: *sca-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      sca-user:
        condition: service_started
      sca-product:
        condition: service_started
    networks: [demo-net]

  sca-gateway:
    build:
      <<: *service-build
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9.9-eclipse-temurin-21}
        MODULE: sca-gateway
        SERVER_PORT: "18080"
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:18080"
    environment:
      <<: *sca-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      sca-order:
        condition: service_started
    networks: [demo-net]

  traffic:
    profiles: ["traffic"]
    image: curlimages/curl:8.5.0
    depends_on:
      sca-gateway:
        condition: service_started
    command:
      - sh
      - -c
      - |
          sleep 40
          while true; do
            curl -sS "http://sca-gateway:18080/order/create?userId=1&productId=1" || true
            echo ""
            sleep 10
          done
    networks: [demo-net]

networks:
  demo-net:
    name: ${DOCKER_NETWORK:-my-network}
    external: true
