name: spring-insight-sca-demo

# 本工程是独立第三方 Demo：不编译 spring-insight 源码。
# 使用前请先准备：
#   1) 将 Spring Insight 安装到本机 Maven 仓库（mvn install）
#   2) 在 .env 中配置 MAVEN_REPO 与 INSIGHT_SERVER_JAR

x-sca-env: &sca-env
  SPRING_PROFILES_ACTIVE: docker
  SPRING_CLOUD_NACOS_DISCOVERY_USERNAME: ${NACOS_USERNAME:-nacos}
  SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: ${NACOS_PASSWORD:-nacos}

x-service-build: &service-build
  context: .
  dockerfile: Dockerfile.service
  additional_contexts:
    # 本机 Maven localRepository（须已含 spring-insight-agent-starter）
    m2repo: ${MAVEN_REPO:?请在 .env 中设置 MAVEN_REPO 为本机 Maven localRepository 路径}
  args:
    MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9.9-eclipse-temurin-21}

services:
  # 独立监测中心：使用已构建好的 insight-server 可执行 jar
  insight-server:
    image: ${JAVA_RUNTIME_IMAGE:-eclipse-temurin:21-jre-alpine}
    container_name: insight-server
    volumes:
      - ${INSIGHT_SERVER_JAR:?请在 .env 中设置 INSIGHT_SERVER_JAR 为 insight-server 可执行 jar 路径}:/app/app.jar:ro
    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "9966:9966"
    networks: [sca-net]

  sca-nacos:
    image: nacos/nacos-server:v3.1.1
    container_name: sca-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-security}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-0123456789abcdefghijklmnopqrstuvwxyz0123456789abcdefghijklmnopqrstuvwxyz}
      SPRING_SECURITY_USER_NAME: ${NACOS_USERNAME:-nacos}
      SPRING_SECURITY_USER_PASSWORD: ${NACOS_PASSWORD:-nacos}
    ports:
      - "38080:8080"
      - "38848:8848"
      - "39848:9848"
    networks: [sca-net]

  sca-product:
    build:
      <<: *service-build
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9.9-eclipse-temurin-21}
        MODULE: sca-product
        SERVER_PORT: "18082"
    environment:
      <<: *sca-env
    depends_on:
      insight-server:
        condition: service_started
      sca-nacos:
        condition: service_started
    networks: [sca-net]

  sca-loyalty:
    build:
      <<: *service-build
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9.9-eclipse-temurin-21}
        MODULE: sca-loyalty
        SERVER_PORT: "18084"
    environment:
      <<: *sca-env
    depends_on:
      insight-server:
        condition: service_started
      sca-nacos:
        condition: service_started
    networks: [sca-net]

  sca-user:
    build:
      <<: *service-build
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9.9-eclipse-temurin-21}
        MODULE: sca-user
        SERVER_PORT: "18083"
    environment:
      <<: *sca-env
    depends_on:
      insight-server:
        condition: service_started
      sca-nacos:
        condition: service_started
      sca-loyalty:
        condition: service_started
    networks: [sca-net]

  sca-order:
    build:
      <<: *service-build
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9.9-eclipse-temurin-21}
        MODULE: sca-order
        SERVER_PORT: "18081"
    ports:
      - "8081:18081"
    environment:
      <<: *sca-env
    depends_on:
      insight-server:
        condition: service_started
      sca-nacos:
        condition: service_started
      sca-user:
        condition: service_started
      sca-product:
        condition: service_started
    networks: [sca-net]

  sca-gateway:
    build:
      <<: *service-build
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9.9-eclipse-temurin-21}
        MODULE: sca-gateway
        SERVER_PORT: "18080"
    ports:
      - "8080:18080"
    environment:
      <<: *sca-env
    depends_on:
      insight-server:
        condition: service_started
      sca-nacos:
        condition: service_started
      sca-order:
        condition: service_started
    networks: [sca-net]

  traffic:
    profiles: ["traffic"]
    image: curlimages/curl:8.5.0
    depends_on:
      sca-gateway:
        condition: service_started
    command:
      - sh
      - -c
      - |
          sleep 40
          while true; do
            curl -sS "http://sca-gateway:18080/order/create?userId=1&productId=1" || true
            echo ""
            sleep 10
          done
    networks: [sca-net]

networks:
  sca-net:
    name: sca-net
    driver: bridge
