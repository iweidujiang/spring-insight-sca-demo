spring:
  application:
    name: sca-product
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:38848
        username: nacos
        password: nacOsdev316
  insight:
    enabled: true
    server-url: http://localhost:9966
    ingest-token: change-me
    sample-rate: 1.0
    http-tracing-enabled: true
    context-propagation-enabled: true
    micrometer-enabled: true
    diagnostic-logs: true
    jvm-metrics:
      enabled: true
    # 存活心跳（联调缩短间隔；默认也可不写，Agent 默认 60s）
    heartbeat:
      enabled: true
      interval-ms: 10000
    db-metrics:
      enabled: true

server:
  port: 18082

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
